[project]
name = "dod-contracts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nick Yelton", email = "nicholasyelton@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "parcel>=0.2.2",
    "pydantic>=2.14.1",
    "rapidfuzz>=3.14.6",
    "scrapy>=2.19.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
dod-contracts = "dod_contracts:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
